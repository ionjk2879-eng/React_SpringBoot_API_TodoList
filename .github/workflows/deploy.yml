name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build backend JAR
        run: |
          chmod +x gradlew
          ./gradlew :backend:bootJar --no-daemon

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy.pem
          chmod 600 ~/.ssh/deploy.pem

      - name: Copy JAR to EC2
        run: |
          scp -i ~/.ssh/deploy.pem \
            -o StrictHostKeyChecking=no \
            backend/build/libs/backend-1.0-SNAPSHOT.jar \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/home/ubuntu/app/backend-1.0-SNAPSHOT.jar

      - name: Pull frontend, build & restart on EC2
        run: |
          ssh -i ~/.ssh/deploy.pem \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=60 \
            -o ServerAliveCountMax=10 \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
            'set -e
            cd ~/app
            git pull origin main
            cd frontend
            npm install
            npm run build
            cd ..
            sudo systemctl restart todoapp
            echo "Deploy complete"'
