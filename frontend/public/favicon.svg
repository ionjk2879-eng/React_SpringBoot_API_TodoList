  <!-- Subtle inner glow -->
  <rect width="32" height="32" rx="7" fill="url(#shine)" opacity="0.18"/>
  <!-- Completed item: check + faded line -->
  <path d="M7 10.5l2.8 2.8 4.4-4.6" stroke="white" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="17" y1="10" x2="25" y2="10" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-opacity="0.45"/>
  <!-- Pending item 2 -->
  <circle cx="9" cy="18" r="2.2" stroke="white" stroke-width="2" stroke-opacity="0.85"/>
  <line x1="14" y1="18" x2="25" y2="18" stroke="white" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Pending item 3 (shorter) -->
  <circle cx="9" cy="25" r="2.2" stroke="white" stroke-width="2" stroke-opacity="0.85"/>
  <line x1="14" y1="25" x2="22" y2="25" stroke="white" stroke-width="2.4" stroke-linecap="round"/>
  <defs>
